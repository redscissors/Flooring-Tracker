<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E · Print preview on</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:Manrope,ui-sans-serif,system-ui,sans-serif;background:#F6F3EC;color:#1C1A17}
button{font-family:inherit;cursor:pointer}
a{color:#40542A}a:hover{color:#2E3B22}
</style>
</helmet>
<div style="width: 1280px; height: 900px; overflow: hidden">
<dc-import name="TopBar" view="preview" show-menu="{{yes}}" erp="keyed" freight="off" hint-size="1280px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
